<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" fill="none" style="background:#FAF8F5;border:1px solid #DED8CE;border-radius:6px;width:100%;height:auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#E4572E"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="24" y="28" font-size="11" font-weight="700" fill="#716E68" letter-spacing="0.08em" text-transform="uppercase">Two-Pass Computer Vision &amp; Spatial Intelligence Pipeline</text>

  <!-- Step 1: Ingestion -->
  <rect x="24" y="50" width="140" height="110" rx="4" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.5"/>
  <text x="36" y="74" font-size="10" font-weight="700" fill="#E4572E">01. INGESTION</text>
  <text x="36" y="96" font-size="12" font-weight="700" fill="#16161A">Broadcast Video</text>
  <text x="36" y="116" font-size="10" fill="#5A5A62">1080p Single Feed</text>
  <text x="36" y="132" font-size="10" fill="#5A5A62">30 / 60 FPS Capture</text>
  <text x="36" y="148" font-size="9" font-family="monospace" fill="#8C8880">OpenCV VideoStream</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="164" y1="105" x2="194" y2="105" stroke="#E4572E" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Detection & Tracking -->
  <rect x="200" y="50" width="150" height="110" rx="4" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.5"/>
  <text x="212" y="74" font-size="10" font-weight="700" fill="#E4572E">02. DETECTION</text>
  <text x="212" y="96" font-size="12" font-weight="700" fill="#16161A">YOLOv11x + ByteTrack</text>
  <text x="212" y="116" font-size="10" fill="#5A5A62">Bounding Boxes</text>
  <text x="212" y="132" font-size="10" fill="#5A5A62">Ground Feet Contact</text>
  <text x="212" y="148" font-size="9" font-family="monospace" fill="#8C8880">Kalman Trajectories</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="350" y1="105" x2="380" y2="105" stroke="#E4572E" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Color Masking & Homography -->
  <rect x="386" y="50" width="155" height="110" rx="4" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.5"/>
  <text x="398" y="74" font-size="10" font-weight="700" fill="#E4572E">03. CLASSIFICATION</text>
  <text x="398" y="96" font-size="12" font-weight="700" fill="#16161A">HSV Torso K-Means</text>
  <text x="398" y="116" font-size="10" fill="#5A5A62">Grass Pixel Masking</text>
  <text x="398" y="132" font-size="10" fill="#5A5A62">Squad Separation</text>
  <text x="398" y="148" font-size="9" font-family="monospace" fill="#8C8880">Unsupervised Colors</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="541" y1="105" x2="571" y2="105" stroke="#E4572E" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Metric Homography -->
  <rect x="577" y="50" width="140" height="110" rx="4" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.5"/>
  <text x="589" y="74" font-size="10" font-weight="700" fill="#E4572E">04. PROJECTION</text>
  <text x="589" y="96" font-size="12" font-weight="700" fill="#16161A">Pitch Homography</text>
  <text x="589" y="116" font-size="10" fill="#5A5A62">3x3 Planar Matrix (H)</text>
  <text x="589" y="132" font-size="10" fill="#5A5A62">105m × 68m FIFA</text>
  <text x="589" y="148" font-size="9" font-family="monospace" fill="#8C8880">cv2.findHomography</text>

  <!-- Arrow 4 -> 5 -->
  <line x1="717" y1="105" x2="747" y2="105" stroke="#E4572E" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5: Analytics Output -->
  <rect x="753" y="50" width="103" height="110" rx="4" fill="#FAF5EF" stroke="#E4572E" stroke-width="1.5"/>
  <text x="765" y="74" font-size="10" font-weight="700" fill="#E4572E">05. OUTPUT</text>
  <text x="765" y="96" font-size="12" font-weight="700" fill="#16161A">Tactical 2D</text>
  <text x="765" y="116" font-size="10" fill="#5A5A62">Voronoi Cells</text>
  <text x="765" y="132" font-size="10" fill="#5A5A62">Pass Graphs</text>
  <text x="765" y="148" font-size="9" font-family="monospace" fill="#8C8880">Radar Video</text>
</svg>

