<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" fill="none" style="background:#FAF8F5;border:1px solid #DED8CE;border-radius:6px;width:100%;height:auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <marker id="sm-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#E4572E"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="24" y="28" font-size="11" font-weight="700" fill="#716E68" letter-spacing="0.08em" text-transform="uppercase">StudyMind — Grounded Retrieval &amp; Citation Verification Architecture</text>

  <!-- Step 1: Upload & Ingestion -->
  <rect x="24" y="50" width="145" height="110" rx="4" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.5"/>
  <text x="36" y="74" font-size="10" font-weight="700" fill="#E4572E">01. INGESTION</text>
  <text x="36" y="96" font-size="12" font-weight="700" fill="#16161A">PDF Documents</text>
  <text x="36" y="116" font-size="10" fill="#5A5A62">Textbooks &amp; Papers</text>
  <text x="36" y="132" font-size="10" fill="#5A5A62">Bounding-Box Pages</text>
  <text x="36" y="148" font-size="9" font-family="monospace" fill="#8C8880">Header / Magic Bytes</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="169" y1="105" x2="199" y2="105" stroke="#E4572E" stroke-width="1.5" marker-end="url(#sm-arrow)"/>

  <!-- Step 2: Hybrid Retrieval -->
  <rect x="205" y="50" width="155" height="110" rx="4" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.5"/>
  <text x="217" y="74" font-size="10" font-weight="700" fill="#E4572E">02. HYBRID RETRIEVAL</text>
  <text x="217" y="96" font-size="12" font-weight="700" fill="#16161A">Dense + Lexical BM25</text>
  <text x="217" y="116" font-size="10" fill="#5A5A62">Qdrant Vector DB</text>
  <text x="217" y="132" font-size="10" fill="#5A5A62">Inverted Keyword Index</text>
  <text x="217" y="148" font-size="9" font-family="monospace" fill="#8C8880">Reciprocal Rank Fusion</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="360" y1="105" x2="390" y2="105" stroke="#E4572E" stroke-width="1.5" marker-end="url(#sm-arrow)"/>

  <!-- Step 3: Untrusted Fencing -->
  <rect x="396" y="50" width="145" height="110" rx="4" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.5"/>
  <text x="408" y="74" font-size="10" font-weight="700" fill="#E4572E">03. SECURITY GUARD</text>
  <text x="408" y="96" font-size="12" font-weight="700" fill="#16161A">Context Fencing</text>
  <text x="408" y="116" font-size="10" fill="#5A5A62">Prompt Injection Block</text>
  <text x="408" y="132" font-size="10" fill="#5A5A62">Tenant Data Isolation</text>
  <text x="408" y="148" font-size="9" font-family="monospace" fill="#8C8880">Early Relevance Gate</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="541" y1="105" x2="571" y2="105" stroke="#E4572E" stroke-width="1.5" marker-end="url(#sm-arrow)"/>

  <!-- Step 4: Verification & NLI -->
  <rect x="577" y="50" width="150" height="110" rx="4" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.5"/>
  <text x="589" y="74" font-size="10" font-weight="700" fill="#E4572E">04. VERIFICATION</text>
  <text x="589" y="96" font-size="12" font-weight="700" fill="#16161A">Quote-Match &amp; NLI</text>
  <text x="589" y="116" font-size="10" fill="#5A5A62">Verbatim Quote Check</text>
  <text x="589" y="132" font-size="10" fill="#5A5A62">Abstention on Weak Proof</text>
  <text x="589" y="148" font-size="9" font-family="monospace" fill="#8C8880">Claim Invariance Test</text>

  <!-- Arrow 4 -> 5 -->
  <line x1="727" y1="105" x2="757" y2="105" stroke="#E4572E" stroke-width="1.5" marker-end="url(#sm-arrow)"/>

  <!-- Step 5: Split View Client -->
  <rect x="763" y="50" width="93" height="110" rx="4" fill="#FAF5EF" stroke="#E4572E" stroke-width="1.5"/>
  <text x="773" y="74" font-size="10" font-weight="700" fill="#E4572E">05. CLIENT</text>
  <text x="773" y="96" font-size="12" font-weight="700" fill="#16161A">Split View</text>
  <text x="773" y="116" font-size="10" fill="#5A5A62">Citation Pills</text>
  <text x="773" y="132" font-size="10" fill="#5A5A62">PDF Highlight</text>
  <text x="773" y="148" font-size="9" font-family="monospace" fill="#8C8880">Vercel UI</text>
</svg>
